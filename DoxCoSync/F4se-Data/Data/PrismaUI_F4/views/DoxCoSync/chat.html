<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CoSync Chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <section class="chat" id="chat">
    <div class="talkers" id="talkers"></div>
    <div class="log" id="log"></div>
    <div class="entry" id="entry">
      <span class="scope" id="scope">ALL</span>
      <input class="input" id="input" maxlength="200" spellcheck="false" autocomplete="off">
    </div>
    <div class="hint" id="hint">ENTER send &nbsp; TAB team/all &nbsp; ESC close</div>
  </section>
  <script src="chat.js"></script>
</body>
</html>
