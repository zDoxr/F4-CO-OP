<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CoSync Multiplayer</title>
  <link rel="stylesheet" href="../prisma_controller_glyphs.css">
  <link rel="stylesheet" href="multiplayer.css">
</head>
<body>
  <!--
    0.3.4 layout: a RobCo-style terminal. The element ids below are the ones
    multiplayer.js renders into (panel, crumb, title, screen, rows, notice,
    list, desc, hints) plus the status strip (status).
  -->
  <main class="panel" id="panel">
    <header class="panel-header">
      <div class="brand">
        <span class="brand-mark">CS</span>
        <span class="brand-text">COSYNC<span class="brand-sub">MULTIPLAYER LINK</span></span>
      </div>
      <div class="status" id="status"></div>
    </header>

    <div class="titlebar">
      <div class="crumb" id="crumb"></div>
      <h1 id="title">MULTIPLAYER</h1>
    </div>

    <section class="screen" id="screen">
      <nav class="col col-list list" id="list"></nav>
      <div class="col col-data">
        <div class="data-head">DATA</div>
        <div class="rows" id="rows"></div>
        <div class="notice" id="notice"></div>
      </div>
    </section>

    <footer class="panel-footer">
      <div class="desc" id="desc"></div>
      <div class="hints" id="hints"></div>
    </footer>
  </main>

  <script src="../prisma_controller_glyphs.js"></script>
  <script src="multiplayer.js"></script>
</body>
</html>
