; ===========================================================================
;  CoSync configuration
;  Lives at:  <Fallout 4>\Data\F4SE\Plugins\CoSync.ini
;  Read once at startup. Missing file or missing key = the default shown.
; ===========================================================================

[Network]

; bSaltInstanceID  (default 1)
;
; Controls what CoSync uses as its per-player IDENTITY KEY -- the value that
; goes out in HELLO and that BOTH peers turn into an entityID.
;
;   1 = real SteamID XOR (process id * 2654435761)   [default, always safe]
;   0 = the raw 64-bit Steam account id
;
; Why the default is 1:
;   Running two instances on ONE Steam account -- or behind a Steam emulator,
;   which reports the same account to every instance -- makes both peers
;   produce the SAME id. Both then derive the same entityID and each side
;   discards the other's traffic as its own echo:
;       [PlayerMgr] Ignoring CREATE for local entity=<id>
;       [PlayerMgr] ProcessEntityUpdate DROP(self) entity=<id> localEID=<id>
;   The visible symptom is that NO player proxy spawns on either machine, and
;   everything built on proxies (map marker, health bars, outfits) silently
;   does nothing. NPC sync keeps working, which makes it look like a player
;   bug rather than an identity bug.
;
;   Salting keeps ids unique in BOTH situations, so 1 is the fail-safe value.
;
; Set 0 only for a genuine two-machine session with two distinct Steam
; accounts, where you want the literal account id to be the identity key
; (e.g. so a returning player keeps the same entityID across restarts).
;
; This setting does NOT affect the real Steam id or persona name. Those are
; always read from Steam and used for display -- your name in the lobby bar
; comes from the live persona either way. Check the log line:
;     [CoSyncNet] Instance token=... (real SteamID=... persona='...') salted=N
bSaltInstanceID=1

[Chat]

; iOpenKey  (default 89 = Y)
;
; Virtual-key code, in DECIMAL, of the key that opens the multiplayer chat box during a
; session. In the box: ENTER sends, TAB switches between ALL (everyone) and
; FACTION (your faction's online members only), ESC closes.
; Codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
iOpenKey=89

[Voice]

; Voice chat: proximity (players near you) and faction (your faction's online
; members, anywhere, full volume). Works without Steam. Key codes are decimal
; virtual-key codes, as above.
bEnabled=1

; iPushToTalkKey  (default 0 = voice activation; 86 = V for push-to-talk)
iPushToTalkKey=0

; iModeKey switches proximity / faction voice (default 85 = U).
; iMuteKey mutes your microphone (default 0 = unbound; 77 = M).
iModeKey=85
iMuteKey=0

; fThreshold  voice activation level, 0.0 - 1.0. Raise it if background noise
; keeps opening your mic; lower it if your voice is cut off.
fThreshold=0.012
fMicGain=1.0

; fVolume  how loud other players are (0.0 - 4.0).
fVolume=1.0

; HOST ONLY -- the host's values apply to everyone in its game:
; fRange  proximity cut-off in game units (about 70 units = 1 m).
; fFullVolumeRange  full volume inside this distance, fading out to fRange.
fRange=3000
fFullVolumeRange=600
iBitrate=24000

[Nameplates]

; Name / faction / level above other players' heads.
bEnabled=1
; fMaxDistance  hide tags beyond this many game units (about 70 units = 1 m).
fMaxDistance=3500
; fHeadOffset  how far above the feet the tag sits.
fHeadOffset=140
