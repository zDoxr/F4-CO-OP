; ===========================================================================
;  CoSync configuration
;  Lives at:  <Fallout 4>\Data\F4SE\Plugins\CoSync.ini
;  Read once at startup. Missing file or missing key = the default shown.
; ===========================================================================

[Network]

; bSaltInstanceID  (default 1)
;
; Controls what CoSync uses as its per-player IDENTITY KEY -- the value that
; goes out in HELLO and that BOTH peers turn into an entityID.
;
;   1 = real SteamID XOR (process id * 2654435761)   [default, always safe]
;   0 = the raw 64-bit Steam account id
;
; Why the default is 1:
;   Running two instances on ONE Steam account -- or behind a Steam emulator,
;   which reports the same account to every instance -- makes both peers
;   produce the SAME id. Both then derive the same entityID and each side
;   discards the other's traffic as its own echo:
;       [PlayerMgr] Ignoring CREATE for local entity=<id>
;       [PlayerMgr] ProcessEntityUpdate DROP(self) entity=<id> localEID=<id>
;   The visible symptom is that NO player proxy spawns on either machine, and
;   everything built on proxies (map marker, health bars, outfits) silently
;   does nothing. NPC sync keeps working, which makes it look like a player
;   bug rather than an identity bug.
;
;   Salting keeps ids unique in BOTH situations, so 1 is the fail-safe value.
;
; Set 0 only for a genuine two-machine session with two distinct Steam
; accounts, where you want the literal account id to be the identity key
; (e.g. so a returning player keeps the same entityID across restarts).
;
; This setting does NOT affect the real Steam id or persona name. Those are
; always read from Steam and used for display -- your name in the lobby bar
; comes from the live persona either way. Check the log line:
;     [CoSyncNet] Instance token=... (real SteamID=... persona='...') salted=N
bSaltInstanceID=1

; bLegacyPidIdentity  (default 0) -- 0.5.1
;
; From 0.5.1 the identity IS the SteamID: the token above is the real
; SteamID64, or -- for the second instance of the CoSyncMultiInstance test rig,
; which reports its index -- the SteamID mixed with that index (the same
; "-P<n>" the saved character key uses). It never changes between launches,
; and a new name, face, sex or SPECIAL never makes a new player.
; Set 1 (together with bSaltInstanceID=1) only for two instances on ONE Steam
; account WITHOUT the multi-instance proxy: the old per-process salt comes back
; and the identity changes on every launch.
bLegacyPidIdentity=0

[Session]

; bPVP  (default 0 = PVE) -- 0.5.1. The HOST's choice decides for everyone:
;   0 = PVE: players cannot damage each other (hits are refused by the engine
;       hook before any damage, stagger or report).
;   1 = PVP: player damage is on; the victim's machine applies it.
; The host can switch it in the Multiplayer menu ("Player Damage"); the menu
; writes this key.
bPVP=0

[Chat]

; iOpenKey  (default 89 = Y)
;
; Virtual-key code, in DECIMAL, of the key that opens the multiplayer chat box during a
; session. In the box: ENTER sends, TAB switches between ALL (everyone) and
; TEAM (your team's online members only), ESC closes.
; Codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
iOpenKey=89

[Voice]

; Voice chat: proximity (players near you) and team (your team's online
; members, anywhere, full volume). Works without Steam. Key codes are decimal
; virtual-key codes, as above.
bEnabled=1

; iPushToTalkKey  (default 0 = voice activation; 86 = V for push-to-talk)
iPushToTalkKey=0

; iModeKey switches proximity / team voice (default 85 = U).
; iMuteKey mutes your microphone (default 0 = unbound; 77 = M).
iModeKey=85
iMuteKey=0

; fThreshold  voice activation level, 0.0 - 1.0. Raise it if background noise
; keeps opening your mic; lower it if your voice is cut off.
fThreshold=0.012
fMicGain=1.0

; fVolume  how loud other players are (0.0 - 4.0).
fVolume=1.0

; HOST ONLY -- the host's values apply to everyone in its game:
; fRange  proximity cut-off in game units (about 70 units = 1 m).
; fFullVolumeRange  full volume inside this distance, fading out to fRange.
fRange=3000
fFullVolumeRange=600
iBitrate=24000

[Nameplates]

; Name / team / level above other players' heads.
bEnabled=1
; fMaxDistance  hide tags beyond this many game units (about 70 units = 1 m).
fMaxDistance=3500
; fHeadOffset  how far above the feet the tag sits.
fHeadOffset=140

[Puppet]

; 0.4.3 -- how this machine treats its copies ("puppets") of NPCs that another
; machine simulates. All default to 1; set one to 0 only to isolate a problem
; (the 0.4.2 behaviour for that part comes back).
; bCombatGate         a puppet may only fight the target its owner's NPC fights
;                     (engine combat entry gated, the owner's fight started on it).
; bMovementChannels   the puppet's walk/run/strafe animation uses the owner's
;                     Speed/Direction values instead of its own AI's intention.
; bGraphInputGate     the puppet's own attack/aim/reload/sneak/stagger decisions
;                     are refused; the owner's arrive over the network.
; bAuthoritativeHealth  the puppet's health is only ever the owner's value (no
;                     local damage prediction -> the enemy health bar never jumps back).
bCombatGate=1
bMovementChannels=1
bGraphInputGate=1
bAuthoritativeHealth=1
; bPackageGate        0.5.0: out of combat a puppet runs a stay-in-place package
;                     instead of its own sandbox/patrol/travel AI, which picked its own
;                     destinations, furniture and idles against the owner's (friendly
;                     NPC desync). Scenes and dialogue keep their own packages.
bPackageGate=1

[Revive]

; A player at 0 health goes down instead of dying. Teammates revive them with a
; Stimpak (activate the downed player): the host grants the revive
; to one player at a time, and the Stimpak is spent only when the revive is
; confirmed. bReviveSystemEnabled=0 turns reviving off.
bReviveSystemEnabled=1
; fDownedSeconds  how long a downed player can be revived before they die.
fDownedSeconds=30
; fReviveChannelSeconds  how long the Stimpak revive takes.
fReviveChannelSeconds=3
; fReviveHealthPercent  health (% of maximum) a revived player gets back.
fReviveHealthPercent=50
; fRespawnSeconds  how long a player who died stays down before getting back
; up with full health -- 0.5.1: at the place they stood when the shared world
; was last saved (the host's save; clients are told when it saves).
fRespawnSeconds=6
